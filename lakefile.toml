name = "Strasbourg2026"
version = "0.1.0"
defaultTargets = ["Part1", "Part2", "Part3"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0-rc1"

[[lean_lib]]
name = "Part1"

[[lean_lib]]
name = "Part2"

[[lean_lib]]
name = "Part3"

# The solutions live in `Solutions/`. They are declared so that they can be
# built and checked, but are kept out of `defaultTargets`: a plain `lake build`
# only compiles the worksheets.

[[lean_lib]]
name = "Part1Solutions"
srcDir = "Solutions"

[[lean_lib]]
name = "Part2Solutions"
srcDir = "Solutions"

[[lean_lib]]
name = "Part3Solutions"
srcDir = "Solutions"
